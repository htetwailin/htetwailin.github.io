# ============================================================================
#  Htet Wai Lin - portfolio  |  GitLab CI/CD
#
#  The site files live at the repository ROOT so that GitHub's branch-based
#  publisher serves them correctly. GitLab Pages instead insists on a folder
#  called `public/`, so the deploy job below builds that folder by copying the
#  site files into it - which is the ordinary GitLab pattern, and keeps one
#  copy of every file rather than two that can drift apart.
#
#    verify  - runs on every push and every merge request
#    deploy  - assembles public/ and publishes it, default branch only
# ============================================================================

stages:
  - verify
  - deploy

default:
  image: alpine:3.20
  interruptible: true

# ---------------------------------------------------------------------------
# Structure: the files the site needs must exist, and nothing may reference an
# asset that is not in the repository. A 404 on style.css is invisible in a
# diff and obvious to every visitor.
# ---------------------------------------------------------------------------
check:structure:
  stage: verify
  script:
    - echo "── required files ──"
    - for f in index.html style.css script.js Htet-Wai-Lin-CV.pdf; do
        test -f "$f" || { echo "MISSING: $f"; exit 1; };
        echo "  ok  $f";
      done
    - echo "── local asset references resolve ──"
    - apk add --no-cache grep >/dev/null
    - |
      fail=0
      refs=$(grep -oE '(href|src)="[^"#:]+"' index.html \
             | sed -E 's/^(href|src)="//; s/"$//' \
             | grep -vE '^(https?:|mailto:|tel:|data:)' | sort -u)
      for r in $refs; do
        if [ -f "$r" ]; then echo "  ok  $r"; else echo "  BROKEN  $r"; fail=1; fi
      done
      exit $fail

# ---------------------------------------------------------------------------
# Content: placeholders must never reach production. A template phone number
# on a live contact page costs real enquiries, and it is the one class of
# mistake nobody notices while reviewing their own work.
# ---------------------------------------------------------------------------
check:content:
  stage: verify
  script:
    - apk add --no-cache grep >/dev/null
    - echo "── no leftover placeholders ──"
    - |
      if grep -nE '\[(PHONE|EMAIL|VIBER|TODO|FIXME)\]|lorem ipsum' -i index.html; then
        echo "Placeholder text found in index.html"; exit 1
      fi
      echo "  ok  none found"
    - echo "── page has a title and a description ──"
    - grep -q '<title>[^<]\+</title>' index.html || { echo "no <title>"; exit 1; }
    - grep -q 'name="description"' index.html    || { echo "no meta description"; exit 1; }
    - echo "  ok"

# ---------------------------------------------------------------------------
# HTML validity. Its own job and allowed to fail: the validator is strict
# about things that are stylistic, and a pedantic warning should not be able
# to stop a deploy. Read it, do not obey it blindly.
# ---------------------------------------------------------------------------
check:html:
  stage: verify
  image: python:3.12-alpine
  allow_failure: true
  script:
    - pip install --quiet html5validator
    - html5validator --root . --match "index.html" --show-warnings

# ---------------------------------------------------------------------------
# Deploy. The job MUST be named `pages` - that name is the trigger, not a
# label - and GitLab publishes exactly what the artifact contains.
# ---------------------------------------------------------------------------
pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html style.css script.js Htet-Wai-Lin-CV.pdf public/
    - echo "Publishing $(find public -type f | wc -l) files to GitLab Pages"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

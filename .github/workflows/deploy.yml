# ============================================================================
#  Verify and deploy to GitHub Pages
#
#  The site files live at the REPOSITORY ROOT (index.html, style.css,
#  script.js, the CV) rather than in a subfolder. That is deliberate: GitHub's
#  built-in "Deploy from a branch" builder serves the root and knows nothing
#  about subfolders, so keeping the site there means the page is correct under
#  either publishing source. `.nojekyll` stops GitHub running the files through
#  Jekyll on the way out.
#
#  This workflow stages only the site files into _site and publishes that, so
#  the README and setup guides stay in the repository without being served.
# ============================================================================

name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files exist
        run: |
          for f in index.html style.css script.js Htet-Wai-Lin-CV.pdf; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
            echo "  ok  $f"
          done

      - name: Local asset references resolve
        run: |
          fail=0
          refs=$(grep -oE '(href|src)="[^"#:]+"' index.html \
                 | sed -E 's/^(href|src)="//; s/"$//' \
                 | grep -vE '^(https?:|mailto:|tel:|data:)' | sort -u)
          for r in $refs; do
            if [ -f "$r" ]; then echo "  ok  $r"; else echo "  BROKEN  $r"; fail=1; fi
          done
          exit $fail

      - name: No leftover placeholders
        run: |
          if grep -nEi '\[(PHONE|EMAIL|VIBER|TODO|FIXME)\]|lorem ipsum' index.html; then
            echo "Placeholder text found in index.html"; exit 1
          fi
          echo "  ok  none found"

      - name: Page has a title and a description
        run: |
          grep -q '<title>[^<]\+</title>' index.html || { echo "no <title>"; exit 1; }
          grep -q 'name="description"'    index.html || { echo "no meta description"; exit 1; }
          echo "  ok"

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html style.css script.js Htet-Wai-Lin-CV.pdf profile.jpg .nojekyll privacy-policy.html terms-of-service.html _site/
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
